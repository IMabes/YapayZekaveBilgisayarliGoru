<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levenshtein Analiz</title>
<script type="text/python" src="63_sayda_odev.py"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00ff88;
    --accent2: #ff3366;
    --accent3: #ffaa00;
    --text: #e0e0f0;
    --muted: #555570;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 24px;
  }

  /* Header */
  header {
    margin-bottom: 60px;
  }

  .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tag::before {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--accent);
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -2px;
    color: #fff;
  }

  h1 span {
    color: var(--accent);
    position: relative;
  }

  .subtitle {
    margin-top: 20px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
    max-width: 500px;
  }

  /* Input section */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  @media (max-width: 600px) {
    .input-grid { grid-template-columns: 1fr; }
  }

  .input-group {
    position: relative;
  }

  .input-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  .word-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: #fff;
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    padding: 18px 20px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 2px;
  }

  .word-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), inset 0 0 20px rgba(0,255,136,0.04);
  }

  .word-input::placeholder {
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 1px;
  }

  /* Analyze button */
  .btn-analyze {
    width: 100%;
    background: var(--accent);
    color: #000;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 18px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
  }

  .btn-analyze::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    transform: translateX(-100%);
    transition: transform 0.3s;
  }

  .btn-analyze:hover::after { transform: translateX(0); }
  .btn-analyze:active { transform: scale(0.99); }
  .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Results */
  .results {
    display: none;
    animation: slideUp 0.4s ease;
  }
  .results.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Metric cards */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  @media (max-width: 600px) {
    .metrics { grid-template-columns: 1fr; }
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px 20px;
    position: relative;
    overflow: hidden;
  }

  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .metric-card.c1::before { background: var(--accent); }
  .metric-card.c2::before { background: var(--accent2); }
  .metric-card.c3::before { background: var(--accent3); }

  .metric-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .metric-value {
    font-family: var(--mono);
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
  }
  .c1 .metric-value { color: var(--accent); }
  .c2 .metric-value { color: var(--accent2); }
  .c3 .metric-value { color: var(--accent3); }

  .metric-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Similarity bar */
  .sim-bar-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 32px;
  }

  .sim-bar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .sim-bar-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .sim-bar-pct {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
  }

  .sim-bar-track {
    height: 6px;
    background: var(--border);
    position: relative;
  }

  .sim-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent3), var(--accent));
    width: 0%;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Matrix */
  .matrix-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 32px;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .matrix-scroll { overflow-x: auto; }

  table {
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 13px;
  }

  td, th {
    width: 38px;
    height: 38px;
    text-align: center;
    border: 1px solid var(--border);
    transition: background 0.2s;
    position: relative;
  }

  th {
    color: var(--muted);
    font-size: 11px;
    background: rgba(255,255,255,0.02);
  }

  td.highlight {
    background: rgba(0,255,136,0.12);
    color: var(--accent);
    font-weight: 700;
  }

  td.path {
    background: rgba(0,255,136,0.06);
    color: #fff;
  }

  td.final {
    background: var(--accent) !important;
    color: #000 !important;
    font-weight: 700;
  }

  /* Ops log */
  .ops-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
  }

  .op-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 13px;
    animation: fadeIn 0.3s ease both;
  }
  .op-row:last-child { border-bottom: none; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .op-badge {
    padding: 3px 10px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
    flex-shrink: 0;
  }
  .op-badge.eslesme  { background: rgba(0,255,136,0.1); color: var(--accent); border: 1px solid rgba(0,255,136,0.2); }
  .op-badge.degistir { background: rgba(255,170,0,0.1); color: var(--accent3); border: 1px solid rgba(255,170,0,0.2); }
  .op-badge.ekle     { background: rgba(100,100,255,0.1); color: #8899ff; border: 1px solid rgba(100,100,255,0.2); }
  .op-badge.sil      { background: rgba(255,51,102,0.1); color: var(--accent2); border: 1px solid rgba(255,51,102,0.2); }

  .op-cost {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="tag">Algoritma Analizi</div>
    <h1>Levenshtein<br><span>Mesafe</span></h1>
    <p class="subtitle">
      Ağırlıklı edit distance · QWERTY klavye mesafesi tabanlı · Gerçek zamanlı matris görselleştirme
    </p>
  </header>

  <div class="input-grid">
    <div class="input-group">
      <label class="input-label">Kaynak Kelime</label>
      <input class="word-input" id="w1" type="text" placeholder="kitten" maxlength="15">
    </div>
    <div class="input-group">
      <label class="input-label">Hedef Kelime</label>
      <input class="word-input" id="w2" type="text" placeholder="sitting" maxlength="15">
    </div>
  </div>

  <button class="btn-analyze" id="btnAnalyze" onclick="analyze()">
    → Analiz Et
  </button>

  <div class="results" id="results">

    <div class="metrics">
      <div class="metric-card c1">
        <div class="metric-label">Ağırlıklı Mesafe</div>
        <div class="metric-value" id="mDist">—</div>
        <div class="metric-sub">edit distance</div>
      </div>
      <div class="metric-card c3">
        <div class="metric-label">Benzerlik Oranı</div>
        <div class="metric-value" id="mSim">—</div>
        <div class="metric-sub">0.00 – 1.00</div>
      </div>
      <div class="metric-card c2">
        <div class="metric-label">İşlem Sayısı</div>
        <div class="metric-value" id="mOps">—</div>
        <div class="metric-sub">toplam adım</div>
      </div>
    </div>

    <div class="sim-bar-wrap">
      <div class="sim-bar-header">
        <span class="sim-bar-label">Benzerlik</span>
        <span class="sim-bar-pct" id="simPct">0%</span>
      </div>
      <div class="sim-bar-track">
        <div class="sim-bar-fill" id="simBar"></div>
      </div>
    </div>

    <div class="matrix-section">
      <div class="section-title">DP Matrisi</div>
      <div class="matrix-scroll">
        <div id="matrixWrap"></div>
      </div>
    </div>

    <div class="ops-section">
      <div class="section-title">İşlem Yolu</div>
      <div id="opsLog"></div>
    </div>

  </div>
</div>
